name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-apk.yml

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: TodoApp/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies and generate Android project
        working-directory: TodoApp
        run: |
          npm ci
          npx expo install --check
          npx expo prebuild --platform android --no-install

      - name: Build installable test APK
        working-directory: TodoApp/android
        env:
          NODE_ENV: production
        run: ./gradlew app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: todo-public-test-apk
          path: TodoApp/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
