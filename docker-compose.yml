name: ${COMPOSE_PROJECT_NAME:-todo-public-local}

services:
  mongo:
    image: mongo:7@sha256:9bdaeb6dac6e7e762e84e2f84103d1f9bb078fa1ba6bde8bb9d2274f655ad173
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-todoapp}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      args:
        PORT: ${SERVER_CONTAINER_PORT:-8080}
    restart: unless-stopped
    ports:
      - "${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_HOST_PORT:-8080}:${SERVER_CONTAINER_PORT:-8080}"
    environment:
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-todoapp}
      PORT: ${SERVER_CONTAINER_PORT:-8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
